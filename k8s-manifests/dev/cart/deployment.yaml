apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/owner: ecommerce
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
      app.kubernetes.io/owner: ecommerce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/owner: ecommerce
    spec:
      serviceAccountName: cart
      securityContext:
        fsGroup: 1000
      containers:
        - name: cart
          image: "public.ecr.aws/aws-containers/retail-store-sample-catalog:1.3.0"
          imagePullPolicy: Always  # IfNotPresent
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
              
          envFrom:
            - configMapRef:
                name: cart
                
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
              
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
              
          resources:
            limits:
              cpu: 256m
              memory: 256Mi
            requests:
              cpu: 256m
              memory: 256Mi
        
